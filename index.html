<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>pattyboomba · scores</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎸</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --blue:#1f3fd1; --ink:#0e1a5c; --deep:#162b9c;
    --white:#f4f4f0; --soft:#aeb8ee; --sun:#ffe45c;
    --font:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *,*::before,*::after{box-sizing:inherit}
  html,body{margin:0;background:var(--blue);color:var(--white);font-family:var(--font);
    -webkit-user-select:none;user-select:none;overflow-x:hidden}
  main{max-width:820px;margin:0 auto;padding:clamp(1.5rem,5vw,3rem) 1.25rem 3rem}

  /* Wordmark — letters bounce to the music */
  .mark{font-weight:900;font-size:clamp(3.2rem,15.5vw,8.6rem);letter-spacing:-.065em;
    line-height:.9;margin:0 0 0 -.04em;white-space:nowrap;display:flex}
  .mark span{display:inline-block;will-change:transform;transition:transform .07s linear}
  .tag{display:flex;flex-wrap:wrap;justify-content:space-between;gap:.5rem 1.5rem;
    margin:1.1rem 0 2.5rem;font-size:1.05rem}
  .tag b{font-weight:700}
  .tag .who{color:var(--soft)}

  /* Player */
  .stage{background:var(--ink);border-radius:22px;padding:1.4rem 1.4rem 1.2rem}
  .now{display:flex;align-items:center;gap:1rem}
  .big{flex:none;width:68px;height:68px;border-radius:50%;border:0;background:var(--sun);
    color:var(--ink);cursor:pointer;display:grid;place-items:center;transition:transform .15s}
  .big:hover{transform:scale(1.06) rotate(-4deg)}
  .big:active{transform:scale(.95)}
  .big svg{width:24px;height:24px}
  .title{font-size:1.45rem;font-weight:700;letter-spacing:-.025em;margin:0;line-height:1.15}
  .time{color:var(--soft);font-size:.85rem;margin-top:.2rem;font-variant-numeric:tabular-nums}
  canvas{display:block;width:100%;height:80px;margin-top:1.2rem;cursor:pointer;touch-action:none}

  /* Track list */
  ol{list-style:none;margin:1.5rem 0 0;padding:0}
  .cue{width:100%;display:grid;grid-template-columns:2rem 1fr auto;align-items:center;gap:.75rem;
    padding:.85rem 1rem;margin-bottom:.35rem;background:var(--deep);border:0;border-radius:14px;
    color:var(--white);font:inherit;text-align:left;cursor:pointer;transition:background .15s}
  .cue:hover{background:#1c35b8}
  .cue .n{color:var(--soft);font-size:.85rem;font-variant-numeric:tabular-nums}
  .cue .name{font-weight:500;font-size:1.05rem;letter-spacing:-.01em}
  .cue .d{color:var(--soft);font-size:.85rem;font-variant-numeric:tabular-nums}
  .cue[aria-current="true"]{background:var(--sun);color:var(--ink)}
  .cue[aria-current="true"] .n,.cue[aria-current="true"] .d{color:var(--ink)}
  .msg{color:var(--soft);padding:1.25rem 0}
  .big:focus-visible,.cue:focus-visible,canvas:focus-visible,a:focus-visible{outline:3px solid var(--sun);outline-offset:3px}

  footer{margin-top:2.5rem;display:flex;flex-wrap:wrap;gap:.6rem}
  footer a{color:var(--white);text-decoration:none;font-weight:500;padding:.55rem 1rem;
    border:1.5px solid var(--soft);border-radius:999px}
  footer a:hover{background:var(--white);color:var(--blue);border-color:var(--white)}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}.mark span{transform:none!important}}
</style>
</head>
<body>
<main>
  <h1 class="mark" id="mark" aria-label="pattyboomba"></h1>
  <div class="tag">
    <span><b>hmm, composer.</b> music for film, tv and anything with pictures.</span>
    <span class="who">Pat Gabriel, Melbourne</span>
  </div>

  <section class="stage" aria-label="Player">
    <div class="now">
      <button class="big" id="play" aria-label="Play">
        <svg id="ico" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l13-7.5z"/></svg>
      </button>
      <div>
        <p class="title" id="title">pick a track, any track</p>
        <div class="time" id="time">0:00 / 0:00</div>
      </div>
    </div>
    <canvas id="wave" aria-label="Seek bar" role="slider" tabindex="0"></canvas>
  </section>

  <ol id="list"><li class="msg">loading tracks…</li></ol>

  <footer>
    <a href="mailto:pattyboombamusic@gmail.com">email me</a>
    <a href="https://open.spotify.com/artist/5gOLNWcBXoossfIRq41gRJ" target="_blank" rel="noopener">spotify</a>
    <a href="https://www.instagram.com/pattyboomba/" target="_blank" rel="noopener">instagram</a>
    <a href="https://www.tiktok.com/@pattyboomba" target="_blank" rel="noopener">tiktok</a>
  </footer>
</main>

<script>
/* ---------- CONFIG ----------
   Leave owner/repo blank to auto-detect from the GitHub Pages URL.
   Drop audio files into the /music folder of the repo. */
const CONFIG = { owner:"", repo:"", folder:"music", branch:"main" };
const EXT = /\.(mp3|m4a|aac|ogg|wav|flac)$/i;

const $ = id => document.getElementById(id);
const audio = new Audio();
audio.preload = "auto";
audio.setAttribute("controlsList","nodownload");
let tracks = [], current = -1, peaks = null, blobUrl = null;
const cache = {};
const iOS = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform==="MacIntel" && navigator.maxTouchPoints>1);
const still = iOS || matchMedia("(prefers-reduced-motion: reduce)").matches;
const MIME = {mp3:"audio/mpeg",m4a:"audio/mp4",aac:"audio/aac",ogg:"audio/ogg",wav:"audio/wav",flac:"audio/flac"};
const SILENT = "data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=";
let unlocked = false;
function unlock(){
  // Must run inside the tap, before any waiting, so iPhone allows playback later
  if(unlocked) return; unlocked = true;
  audio.src = SILENT; const p = audio.play(); p && p.catch(()=>{});
}

// Wordmark letters
const letters = [..."pattyboomba"].map(c => { const s=document.createElement("span"); s.textContent=c; s.setAttribute("aria-hidden","true"); $("mark").appendChild(s); return s; });

// No right-click / dragging files out
document.addEventListener("contextmenu", e => e.preventDefault());
document.addEventListener("dragstart", e => e.preventDefault());

function pretty(name){ return name.replace(EXT,"").replace(/^\d+[\s._-]*/,"").replace(/[_-]+/g," ").trim().toLowerCase(); }
function fmt(s){ if(!isFinite(s)) return "0:00"; s=Math.floor(s); return Math.floor(s/60)+":"+String(s%60).padStart(2,"0"); }

function repoInfo(){
  let {owner,repo} = CONFIG;
  const host = location.hostname;
  if(!owner && host.endsWith(".github.io")) owner = host.split(".")[0];
  if(!repo){ const seg = location.pathname.split("/").filter(Boolean)[0]; repo = seg && !seg.includes(".") ? seg : owner+".github.io"; }
  return {owner,repo};
}

async function loadList(){
  const {owner,repo} = repoInfo();
  let files = [];
  try{
    const r = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${CONFIG.folder}?ref=${CONFIG.branch}`);
    if(!r.ok) throw 0;
    files = (await r.json()).filter(f => EXT.test(f.name)).map(f => f.name);
  }catch{
    try{ files = await (await fetch(`${CONFIG.folder}/tracks.json`)).json(); }catch{}
  }
  files.sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}));
  tracks = files.map(f => ({title:pretty(f), ext:(f.split('.').pop()||'').toLowerCase(), src:`${CONFIG.folder}/${encodeURIComponent(f)}`}));
  render();
}

function render(){
  const ol = $("list");
  if(!tracks.length){ ol.innerHTML = `<li class="msg">nothing here yet. drop audio into the /${CONFIG.folder} folder.</li>`; return; }
  ol.innerHTML = "";
  tracks.forEach((t,i)=>{
    const li = document.createElement("li");
    li.innerHTML = `<button class="cue"><span class="n">${i+1}</span><span class="name"></span><span class="d" id="d${i}"></span></button>`;
    li.querySelector(".name").textContent = t.title;
    li.firstChild.onclick = () => { unlock(); startViz(); i===current ? toggle() : select(i,true); };
    ol.appendChild(li);
    const probe = new Audio(); probe.preload="metadata"; probe.src=t.src;
    probe.onloadedmetadata = () => { $("d"+i).textContent = fmt(probe.duration); };
  });
}

async function select(i, autoplay){
  current = i; peaks = null; draw();
  document.querySelectorAll(".cue").forEach((b,j)=>b.setAttribute("aria-current", j===i));
  $("title").textContent = tracks[i].title;
  let buf = cache[i];
  if(!buf){ buf = await (await fetch(tracks[i].src)).arrayBuffer(); cache[i]=buf; }
  if(current!==i) return;
  if(blobUrl) URL.revokeObjectURL(blobUrl);
  blobUrl = URL.createObjectURL(new Blob([buf], {type: MIME[tracks[i].ext] || "audio/mpeg"}));
  audio.src = blobUrl;
  if(autoplay){ actx && actx.resume(); const p = audio.play(); p && p.catch(()=>{}); }
  buildPeaks(buf.slice(0), i);
}

async function buildPeaks(buf, i){
  try{
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    const data = (await ctx.decodeAudioData(buf)).getChannelData(0);
    const n = 160, step = Math.floor(data.length/n), out=[];
    for(let k=0;k<n;k++){ let m=0; for(let j=k*step;j<(k+1)*step;j+=16) m=Math.max(m,Math.abs(data[j])); out.push(m); }
    const top = Math.max(...out)||1;
    if(current===i){ peaks = out.map(v=>v/top); draw(); }
    ctx.close();
  }catch{}
}

// Wordmark reacts to the music
let actx, analyser, bins;
function startViz(){
  if(actx){ actx.resume(); return; }
  if(still) return;
  try{
    actx = new (window.AudioContext||window.webkitAudioContext)();
    actx.resume();
    analyser = actx.createAnalyser(); analyser.fftSize = 64; analyser.smoothingTimeConstant = .8;
    actx.createMediaElementSource(audio).connect(analyser); analyser.connect(actx.destination);
    bins = new Uint8Array(analyser.frequencyBinCount);
    (function loop(){
      analyser.getByteFrequencyData(bins);
      letters.forEach((s,k)=>{ const v = audio.paused ? 0 : bins[2+k*2]/255; s.style.transform = `translateY(${-v*v*18}%)`; });
      requestAnimationFrame(loop);
    })();
  }catch{}
}

function toggle(){
  unlock(); startViz();
  if(current<0 && tracks.length) return select(0,true);
  audio.paused ? audio.play() : audio.pause();
}

// Waveform seek bar
const cv = $("wave"), g = cv.getContext("2d");
function draw(){
  const dpr = devicePixelRatio||1, w = cv.clientWidth, h = cv.clientHeight;
  cv.width = w*dpr; cv.height = h*dpr; g.scale(dpr,dpr); g.clearRect(0,0,w,h);
  const css = getComputedStyle(document.documentElement);
  const on = css.getPropertyValue("--sun"), off = css.getPropertyValue("--deep");
  const p = audio.duration ? audio.currentTime/audio.duration : 0;
  const bars = peaks || Array(160).fill(.05), bw = w/bars.length;
  bars.forEach((v,k)=>{
    const bh = Math.max(3, v*h*.92);
    g.fillStyle = (k/bars.length) < p ? on : off;
    g.beginPath(); g.roundRect ? g.roundRect(k*bw,(h-bh)/2,Math.max(1.5,bw-2),bh,2) : g.rect(k*bw,(h-bh)/2,Math.max(1.5,bw-2),bh); g.fill();
  });
}
function seekAt(x){ const r = cv.getBoundingClientRect(); if(audio.duration) audio.currentTime = Math.min(1,Math.max(0,(x-r.left)/r.width))*audio.duration; }
let dragging=false;
cv.addEventListener("pointerdown",e=>{dragging=true;cv.setPointerCapture(e.pointerId);seekAt(e.clientX)});
cv.addEventListener("pointermove",e=>dragging&&seekAt(e.clientX));
cv.addEventListener("pointerup",()=>dragging=false);
cv.addEventListener("keydown",e=>{ if(e.key==="ArrowRight") audio.currentTime+=5; if(e.key==="ArrowLeft") audio.currentTime-=5; });

$("play").onclick = toggle;
document.addEventListener("keydown",e=>{ if(e.code==="Space" && e.target===document.body){e.preventDefault();toggle();} });

const PLAY='<path d="M7 4.5v15l13-7.5z"/>', PAUSE='<path d="M6 4h4v16H6zM14 4h4v16h-4z"/>';
audio.onplay = () => { if(!audio.src.startsWith("blob:")) return; $("ico").innerHTML=PAUSE; $("play").setAttribute("aria-label","Pause"); };
audio.onpause = () => { $("ico").innerHTML=PLAY; $("play").setAttribute("aria-label","Play"); };
audio.ontimeupdate = () => { $("time").textContent = fmt(audio.currentTime)+" / "+fmt(audio.duration); draw(); };
audio.onended = () => { if(!audio.src.startsWith("blob:")) return; if(current < tracks.length-1) select(current+1,true); };
addEventListener("resize", draw);

draw();
loadList();
</script>
</body>
</html>
